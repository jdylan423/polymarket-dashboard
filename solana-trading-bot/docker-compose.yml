version: '3.8'

services:
  solana-trading-bot:
    # Build from local Dockerfile
    build:
      context: .
      dockerfile: Dockerfile
    
    # Container name
    container_name: solana-trading-bot
    
    # Restart policy - auto-restart on failure
    restart: unless-stopped
    restart_policy:
      condition: on-failure
      delay: 30s
      max_attempts: 10
      window: 300s
    
    # Environment variables
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max_old_space_size=512
      # Load from .env file
      - WALLET_ADDRESS=${WALLET_ADDRESS}
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      - DRY_RUN=${DRY_RUN:-false}
      - RPC_ENDPOINT=${RPC_ENDPOINT:-https://api.mainnet-beta.solana.com}
      - DISCORD_WEBHOOK_ALERTS=${DISCORD_WEBHOOK_ALERTS}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - STARTING_CAPITAL_SOL=${STARTING_CAPITAL_SOL:-2}
      - MAX_POSITION_SIZE_SOL=${MAX_POSITION_SIZE_SOL:-0.5}
      - MAX_SIMULTANEOUS_POSITIONS=${MAX_SIMULTANEOUS_POSITIONS:-4}
      - STOP_LOSS_PERCENT=${STOP_LOSS_PERCENT:--20}
      - TAKE_PROFIT_PERCENT=${TAKE_PROFIT_PERCENT:-30}
      - PORTFOLIO_STOP_LOSS_PERCENT=${PORTFOLIO_STOP_LOSS_PERCENT:--30}
      - SCAN_INTERVAL_SECONDS=${SCAN_INTERVAL_SECONDS:-30}
      - DEBUG_MODE=${DEBUG_MODE:-false}
      - ENABLE_SAFEGUARDS=${ENABLE_SAFEGUARDS:-true}
    
    # Volume mounts
    volumes:
      # Persistent data
      - ./data:/app/data
      - ./state:/app/state
      - ./logs:/app/logs
      
      # Configuration
      - ./.env:/app/.env:ro
    
    # Port mappings (if needed for monitoring)
    # ports:
    #   - "3000:3000"  # Monitoring dashboard (future feature)
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        labels: "service=solana-trading-bot"
    
    # Health check
    healthcheck:
      test: ["CMD", "test", "-f", "/app/state/heartbeat.json"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 30s
    
    # Network
    networks:
      - solana-network

networks:
  solana-network:
    driver: bridge

# Usage:
# 1. Copy .env.example to .env and configure
# 2. docker-compose build
# 3. docker-compose up -d
# 4. docker-compose logs -f
# 5. docker-compose stop (graceful shutdown)
